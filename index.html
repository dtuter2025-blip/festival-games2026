<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05010f">
<title>우리가 만든 게임 · INTRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic+Coding:wght@400;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#05010f;color:#fff;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
    -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;
    font-family:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
  *{white-space:nowrap}
  /* ───────── 인트로 전체 (기존 웹앱 위에 덮이는 레이어) ───────── */
  #intro{position:fixed;inset:0;z-index:9999;transition:opacity .8s ease,visibility .8s ease;
    background:radial-gradient(ellipse at 50% 45%,#1a0836 0%,#05010f 60%)}
  /* 모바일 세로 비율 무대: 휴대폰에선 화면 전체, PC에선 가운데 세로 화면으로 보입니다 */
  #stage{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:var(--sw,100vw);overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,.6)}
  #intro.done{opacity:0;visibility:hidden;pointer-events:none}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* 시작 화면 */
  #gate{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;text-align:center;transition:opacity .45s ease;padding:24px}
  #gate.hide{opacity:0;pointer-events:none}
  .coin{font-family:Orbitron,sans-serif;font-weight:700;letter-spacing:.45em;color:#ffd400;
    font-size:min(15px,calc(var(--sw) * .036));text-shadow:0 0 12px #ffd400;animation:blink 1.1s steps(2,start) infinite;padding-left:.45em}
  #startBtn{font-family:Orbitron,sans-serif;font-weight:900;letter-spacing:.22em;color:#fff;
    font-size:min(26px,calc(var(--sw) * .058));padding:.8em 1.3em .8em 1.5em;border-radius:16px;cursor:pointer;
    background:rgba(12,4,32,.55);border:2px solid #ff2e88;text-shadow:0 0 12px #ff2e88;
    box-shadow:0 0 26px rgba(255,46,136,.75),inset 0 0 22px rgba(255,46,136,.35);animation:pulse 1.2s ease-in-out infinite}
  #startBtn:disabled{opacity:.45;animation:none;cursor:wait}
  .hint{font-size:min(15px,calc(var(--sw) * .038));text-shadow:0 1px 6px #05010f,0 0 2px #05010f;color:#b9bdf0;opacity:.85;letter-spacing:.04em}

  /* 상단 버튼 */
  #hud{position:absolute;z-index:4;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));
    display:flex;gap:8px;opacity:0;pointer-events:none;transition:opacity .4s}
  #hud.on{opacity:1;pointer-events:auto}
  .hbtn{font-family:Orbitron,sans-serif;font-weight:700;font-size:min(11px,calc(var(--sw) * .027));letter-spacing:.14em;color:#fff;cursor:pointer;
    background:rgba(10,4,30,.45);border:1px solid rgba(255,255,255,.3);padding:7px 11px;border-radius:999px;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .hbtn:hover{border-color:#fff;background:rgba(255,255,255,.12)}

  /* 소리가 막혔을 때 안내 */
  #soundTip{position:absolute;z-index:4;left:50%;bottom:calc(var(--sw) * .2);transform:translateX(-50%);
    font-size:min(15px,calc(var(--sw) * .038));color:#fff;background:rgba(10,4,30,.72);border:1px solid rgba(255,255,255,.35);
    padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .4s}
  #soundTip.on{opacity:1}
  /* 마지막 입장 버튼 */
  #cta{position:absolute;z-index:4;left:50%;top:80%;transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:#fff;text-decoration:none;
    padding:calc(var(--sw) * .032) calc(var(--sw) * .085) calc(var(--sw) * .028);border-radius:18px;border:3px solid transparent;
    background:linear-gradient(#0d0626,#0d0626) padding-box,
               linear-gradient(90deg,#ff2e88,#ffd400,#7cff4f,#00e5ff,#b26bff,#ff2e88) border-box;
    background-size:100% 100%,200% 100%;
    transition:opacity .5s ease,transform .7s cubic-bezier(.2,1.7,.4,1)}
  #cta.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto;
    animation:flow 2.2s linear infinite,ctaGlow 1s ease-in-out infinite}
  #cta .big{font-family:"Black Han Sans",sans-serif;font-size:min(30px,calc(var(--sw) * .072));letter-spacing:.04em}
  #cta .small{font-family:Orbitron,sans-serif;font-weight:900;font-size:min(12px,calc(var(--sw) * .028));letter-spacing:.42em;color:#ffd400;padding-left:.42em}
  #cta:hover{filter:brightness(1.2)}

  @keyframes blink{to{visibility:hidden}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06);box-shadow:0 0 44px rgba(255,46,136,.95),inset 0 0 26px rgba(255,46,136,.5)}}
  @keyframes flow{to{background-position:0 0,200% 0}}
  @keyframes ctaGlow{0%,100%{box-shadow:0 0 18px rgba(0,229,255,.45),0 0 40px rgba(255,46,136,.25)}50%{box-shadow:0 0 34px rgba(0,229,255,.9),0 0 70px rgba(255,46,136,.5)}}

  /* ───────── 게임 선택(대문) 화면 — 인트로가 끝나면 드러납니다 ───────── */
  .lobby-direct #intro{display:none}
  #app{position:fixed;inset:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    touch-action:pan-y;background:#05010f}
  #app *{white-space:normal;box-sizing:border-box}
  .lb-bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;
    background:linear-gradient(#03010b 0%,#12052a 46%,#2b0a48 64%,#07021a 100%)}
  .lb-bg::before{content:"";position:absolute;inset:0;opacity:.75;
    background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 32% 8%,#fff 50%,transparent 51%),
      radial-gradient(1.4px 1.4px at 58% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 78% 12%,#fff 50%,transparent 51%),
      radial-gradient(1.2px 1.2px at 90% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 22% 40%,#fff 50%,transparent 51%),
      radial-gradient(1px 1px at 68% 44%,#fff 50%,transparent 51%),radial-gradient(1.3px 1.3px at 44% 34%,#fff 50%,transparent 51%),
      radial-gradient(1px 1px at 6% 52%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 86% 56%,#fff 50%,transparent 51%);
    animation:lbTwinkle 3.2s ease-in-out infinite alternate}
  .lb-sunbox{position:absolute;left:0;right:0;top:0;height:64%;overflow:hidden}
  .lb-sun{position:absolute;left:50%;bottom:0;width:min(62vw,460px);aspect-ratio:1;transform:translate(-50%,42%);border-radius:50%;opacity:.3;
    background:linear-gradient(#ffe45c,#ff8a3d 40%,#ff2e88 62%);
    -webkit-mask:linear-gradient(#000 0 30%,transparent 30% 32.5%,#000 32.5% 38%,transparent 38% 41.5%,#000 41.5% 46%,transparent 46% 50.5%,#000 50.5%);
    mask:linear-gradient(#000 0 30%,transparent 30% 32.5%,#000 32.5% 38%,transparent 38% 41.5%,#000 41.5% 46%,transparent 46% 50.5%,#000 50.5%)}
  .lb-floor{position:absolute;left:-50%;right:-50%;top:64%;bottom:-10%;transform:perspective(320px) rotateX(62deg);transform-origin:50% 0;
    background-image:linear-gradient(rgba(255,46,136,.55) 2px,transparent 2px),linear-gradient(90deg,rgba(255,46,136,.55) 2px,transparent 2px);
    background-size:60px 60px;animation:lbGrid 1.6s linear infinite;
    -webkit-mask:linear-gradient(transparent,#000 30%);mask:linear-gradient(transparent,#000 30%)}
  .lb-bg::after{content:"";position:absolute;left:0;right:0;top:64%;height:2px;background:#fff;opacity:.6;box-shadow:0 0 18px 4px #ff2e88}

  .lb-wrap{position:relative;max-width:1180px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  .lb-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .lb-brand{font-family:Orbitron,sans-serif;font-weight:700;font-size:11px;letter-spacing:.32em;color:rgba(200,210,255,.7)}
  .lb-replay{font-family:"Black Han Sans",sans-serif;font-size:13px;color:#fff;cursor:pointer;
    background:rgba(10,4,30,.5);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 13px;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .lb-replay:hover{border-color:#fff;background:rgba(255,255,255,.12)}

  .lb-head{text-align:center;margin:18px 0 22px}
  .lb-title{margin:0;font-weight:400;font-size:clamp(40px,11vw,76px);line-height:1.05;letter-spacing:.01em;
    background:linear-gradient(90deg,#ff2e88,#00e5ff,#ffd400,#7cff4f,#b26bff,#ff8c1a);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 #3a0f63) drop-shadow(0 0 18px rgba(255,46,136,.45))}
  .lb-sel{margin:10px 0 0;font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(12px,3.4vw,15px);letter-spacing:.38em;padding-left:.38em;color:#ffd400;
    text-shadow:0 0 12px #ffd400;animation:lbBlink 1.1s steps(2,start) infinite}
  .lb-desc{margin:8px 0 0;font-size:14px;color:#c9cdf5;letter-spacing:.04em}

  .lb-grid{list-style:none;margin:0;padding:0;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
  .lb-grid li{opacity:0;transform:translateY(26px)}
  #app.lb-in .lb-grid li{animation:lbIn .6s cubic-bezier(.2,1.4,.4,1) forwards;animation-delay:calc(var(--i) * 90ms + 120ms)}
  .lb-card{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;min-height:118px;padding:14px 16px 14px 14px;
    border-radius:18px;text-decoration:none;color:#fff;overflow:hidden;isolation:isolate;cursor:pointer;
    background:linear-gradient(135deg,color-mix(in srgb,var(--c) 26%,#0b0520) 0%,#0b0520 70%);
    border:2px solid var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 22px color-mix(in srgb,var(--c) 14%,transparent);
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;-webkit-tap-highlight-color:transparent}
  .lb-card::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;transform:translateX(-120%) skewX(-24deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent)}
  .lb-card:hover,.lb-card:focus-visible{transform:translateY(-4px);border-color:color-mix(in srgb,var(--c) 55%,#fff);
    box-shadow:0 0 30px color-mix(in srgb,var(--c) 80%,transparent),inset 0 0 26px color-mix(in srgb,var(--c) 22%,transparent);outline:none}
  .lb-card:hover::after,.lb-card:focus-visible::after{animation:lbSweep .7s ease}
  .lb-card:active{transform:scale(.97)}
  .lb-num{position:absolute;right:56px;top:50%;transform:translateY(-50%);z-index:-1;font-family:Orbitron,sans-serif;font-weight:900;font-size:92px;line-height:1;
    color:transparent;-webkit-text-stroke:2px color-mix(in srgb,var(--c) 55%,transparent);opacity:.22;pointer-events:none}
  .lb-sprite{position:relative;width:88px;height:88px;display:grid;place-items:center;border-radius:14px;
    background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--c) 55%,transparent),transparent 70%)}
  .lb-sprite canvas{width:72px;height:72px;image-rendering:pixelated;image-rendering:crisp-edges}
  .lb-card:hover .lb-sprite canvas,.lb-card:focus-visible .lb-sprite canvas{animation:lbHop .45s ease-in-out infinite alternate}
  .lb-info{min-width:0;display:flex;flex-direction:column;gap:4px;container-type:inline-size}
  .lb-player{font-family:Orbitron,sans-serif;font-weight:900;font-size:10px;letter-spacing:.3em;color:var(--c);text-shadow:0 0 8px var(--c)}
  .lb-game{font-weight:400;font-size:clamp(19px,13cqi,28px);line-height:1.12;word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance;
    text-shadow:0 0 12px color-mix(in srgb,var(--c) 80%,transparent),3px 3px 0 color-mix(in srgb,var(--c) 70%,#000)}
  .lb-maker{display:flex;align-items:baseline;gap:7px;font-size:16px;color:#e3e6ff}
  .lb-maker em{font-style:normal;font-family:Orbitron,sans-serif;font-weight:700;font-size:10px;letter-spacing:.22em;color:color-mix(in srgb,var(--c) 70%,#fff)}
  .lb-play{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;font-size:16px;padding-left:3px;color:#0b0520;
    background:var(--c);box-shadow:0 0 16px var(--c)}
  .lb-card:hover .lb-play,.lb-card:focus-visible .lb-play{animation:lbPulse .8s ease-in-out infinite}
  .lb-card.soon{cursor:default;filter:saturate(.35) brightness(.75)}
  .lb-card.soon:hover{transform:none}
  .lb-card.soon .lb-play{width:auto;height:auto;padding:6px 10px;border-radius:999px;font-size:12px;background:rgba(255,255,255,.14);color:#fff;box-shadow:none}

  .lb-foot{margin:26px 0 0;text-align:center;font-size:13px;color:rgba(201,205,245,.75);letter-spacing:.04em}
  .lb-foot b{font-family:Orbitron,sans-serif;font-weight:700;font-size:10px;letter-spacing:.3em;display:block;margin-bottom:6px;color:rgba(255,255,255,.5)}

  @media (min-width:760px){
    .lb-wrap{padding-left:28px;padding-right:28px}
    .lb-head{margin:26px 0 34px}
    .lb-grid{gap:18px}
  }
  @keyframes lbIn{to{opacity:1;transform:none}}
  @keyframes lbBlink{to{visibility:hidden}}
  @keyframes lbTwinkle{to{opacity:.35}}
  @keyframes lbGrid{to{background-position:0 60px}}
  @keyframes lbSweep{to{transform:translateX(120%) skewX(-24deg)}}
  @keyframes lbHop{to{transform:translateY(-6px)}}
  @keyframes lbPulse{50%{transform:scale(1.1)}}
  @media (prefers-reduced-motion:reduce){
    .lb-floor,.lb-bg::before,.lb-sel{animation:none}
    #app.lb-in .lb-grid li{animation-duration:.01s;animation-delay:0s}
  }
</style>
<script>if (/[?&]lobby=/.test(location.search)) document.documentElement.classList.add('lobby-direct');</script>
</head>
<body>

<!-- 게임 선택(대문) 화면: 인트로가 끝나면 이 화면이 드러납니다. index.html?lobby=1 로 열면 인트로 없이 바로 보입니다 -->
<main id="app" aria-label="게임 선택">
  <div class="lb-bg" aria-hidden="true"><div class="lb-sunbox"><div class="lb-sun"></div></div><div class="lb-floor"></div></div>
  <div class="lb-wrap">
    <div class="lb-top">
      <span class="lb-brand">STUDENT GAME ARCADE</span>
      <button id="replay" class="lb-replay" type="button">↺ 인트로 다시 보기</button>
    </div>
    <header class="lb-head">
      <h1 class="lb-title">우리가 만든 게임</h1>
      <p class="lb-sel">SELECT YOUR GAME</p>
      <p class="lb-desc">카드를 누르면 게임이 시작돼요</p>
    </header>
    <ul class="lb-grid" id="lbGrid"></ul>
    <footer class="lb-foot"><b>THE CREATORS</b>바이브코딩으로 탄생한 학생 개발자들의 게임 세계</footer>
  </div>
</main>

<div id="intro" aria-label="우리가 만든 게임 인트로">
  <div id="stage">
  <canvas id="cv"></canvas>
  <div id="gate">
    <div class="coin">INSERT COIN</div>
    <button id="startBtn" type="button" disabled>LOADING…</button>
    <div class="hint">🔊 음량을 올리고 시작하세요</div>
  </div>
  <div id="hud">
    <button class="hbtn" id="muteBtn" type="button" aria-label="소리 끄기/켜기">SOUND ON</button>
    <button class="hbtn" id="skipBtn" type="button">SKIP ▸▸</button>
  </div>
  <div id="soundTip">🔇 화면을 한 번 터치하면 소리가 나와요</div>
  <a id="cta" role="button" tabindex="0"><span class="big">게임하러 가기</span><span class="small">PRESS START</span></a>
  </div>
</div>

function drawWipes(t) {
  for (const wp of WIPES) {
    if (t < wp.t - 0.45 || t > wp.t + 0.5) continue;
    const n = wp.cols.length, sk = H * 0.45;
    wp.cols.forEach((col, j) => {
      const off = (j - (n === 3 ? 1 : n - 1)) * 0.055;
      const lead = E.inOutCubic(prog(t, wp.t - 0.32 + off, wp.t + off)), trail = E.inOutCubic(prog(t, wp.t + off, wp.t + 0.32 + off));
      if (lead <= 0 || trail >= 1) return;
      const xl = lerp(-sk / 2, W + sk / 2, lead), xt = lerp(-sk / 2, W + sk / 2, trail);
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(xt + sk / 2, -2); ctx.lineTo(xl + sk / 2, -2); ctx.lineTo(xl - sk / 2, H + 2); ctx.lineTo(xt - sk / 2, H + 2); ctx.closePath(); ctx.fill();
    });
    // 와이프 위에 크게 지나가는 플레이어 번호
    const idx = WIPES.indexOf(wp);
    if (idx < C.length && Math.abs(t - wp.t) < 0.3) {
      const k = (t - wp.t + 0.3) / 0.6, im = textImg(idx < C.length ? `P${idx + 1}` : '', S * 0.5, F.en, { w: 900, fill: 'rgba(5,1,15,0.18)' });
      dimg(im, lerp(W * 0.8, W * 0.2, k), H / 2, 'c', Math.sin(k * Math.PI));
    }
  }
}
function getPatterns() {
  if (!G.scan) {
    const c = document.createElement('canvas'); c.width = 1; c.height = 3; const x = c.getContext('2d'); x.fillStyle = 'rgba(0,0,0,0.55)'; x.fillRect(0, 0, 1, 1); G.scan = octx.createPattern(c, 'repeat');
    const n = document.createElement('canvas'); n.width = n.height = 128; const nx = n.getContext('2d'), id = nx.createImageData(128, 128);
    for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 22; }
    nx.putImageData(id, 0, 0); G.grain = n;
    const vg = octx.createRadialGradient(W / 2, H / 2, S * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.62); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)'); G.vig = vg;
  }
}
function post(t) {
  ctx = octx; octx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawWipes(t);
  getPatterns();
  ctx.fillStyle = G.vig; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = G.scan; ctx.globalAlpha = 0.22; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  const r = mulberry32(Math.floor(t * 24)), ox = -r() * 128, oy = -r() * 128;
  for (let x = ox; x < W; x += 128) for (let y = oy; y < H; y += 128) ctx.drawImage(G.grain, x, y);
  for (const [s, dur, a, col] of FLASHES) { const dt = t - s; if (dt < 0 || dt > dur) continue; ctx.fillStyle = rgba(col, a * Math.pow(1 - dt / dur, 2)); ctx.fillRect(0, 0, W, H); }
  if (DEBUG) { ctx.fillStyle = '#0f0'; ctx.font = '14px monospace'; ctx.fillText('t=' + t.toFixed(2), 10, H - 12); }
  ctx = sctx;
}

/* ---------- 프레임 렌더 ---------- */
function render(t, amb) {
  ctx = sctx; sctx.setTransform(DPR, 0, 0, DPR, 0, 0); sctx.globalAlpha = 1; sctx.globalCompositeOperation = 'source-over';
  if (t < 0) {                                       // 시작 대기 화면
    drawSky(); drawStars(amb * 0.05, 0.03, 0.9); drawSun(horizonY(), 0.35, 0.6); drawFloor(horizonY(), '#ff2e88', 0.7, amb * 0.35);
    octx.setTransform(1, 0, 0, 1, 0, 0); octx.drawImage(sc, 0, 0); post(-10); return;
  }
  const [sx, sy] = shakeAt(t); sctx.translate(sx, sy);
  if (t < T_TITLE) sceneBoot(t);
  else if (t < T_PLAY) sceneTitle(t);
  else if (t < T_LINE) { const i = Math.min(C.length - 1, Math.floor((t - T_PLAY) / PER)); scenePlayer(i, t - T_PLAY - i * PER, t); }
  else if (t < T_FIN) sceneLineup(t);
  else sceneFinale(t);
  composite(t); post(t);
}

/* =====================================================================
   사운드 — 미리 만들어 둔 배경음(MP3)을 <audio>로 재생
   · 갤럭시·아이폰 어디서나 가장 확실하게 소리가 나는 방식입니다.
   · 아이폰 무음 스위치가 켜져 있어도 유튜브처럼 소리가 납니다.
   · 화면은 음악 시간에 맞춰 따라가므로 박자가 어긋나지 않습니다.
   ===================================================================== */
const bgm = new Audio();
bgm.preload = 'auto'; bgm.setAttribute('playsinline', ''); bgm.setAttribute('webkit-playsinline', '');
bgm.src = CONFIG.bgmUrl || document.getElementById('bgm-data').textContent.trim();
const bgmDur = () => (isFinite(bgm.duration) && bgm.duration > 0 ? bgm.duration : T_FIN + 10);

/* =====================================================================
   진행 · UI
   ===================================================================== */
const gate = document.getElementById('gate'), startBtn = document.getElementById('startBtn');
const hud = document.getElementById('hud'), skipBtn = document.getElementById('skipBtn'), muteBtn = document.getElementById('muteBtn');
const cta = document.getElementById('cta'), replay = document.getElementById('replay'), soundTip = document.getElementById('soundTip');
let state = 'gate', perf0 = 0, muted = false, raf = 0, running = false, holdTimer = 0;

function placeCTA() { if (!W) return; const y = Math.min(H * 0.9, finLayout().cta); cta.style.top = y + 'px'; }
function clock() { return running ? (performance.now() - perf0) / 1000 : 0; }
function go(fromAudio) {                       // 화면 시계 시작 (소리가 나는 순간에 맞춤)
  if (running || state !== 'play') return;
  running = true; clearTimeout(holdTimer);
  perf0 = performance.now() - (fromAudio ? bgm.currentTime * 1000 : 0);
}
function playAt(t) {
  if (!CONFIG.sound || state !== 'play' || t >= bgmDur() - 0.3) return;
  try {
    if (Math.abs(bgm.currentTime - t) > 0.25) bgm.currentTime = t;
    bgm.muted = muted;
    const p = bgm.play(); if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
function wake() { if (state === 'play' && CONFIG.sound && !muted && bgm.paused) playAt(clock()); }
bgm.addEventListener('playing', () => go(true));

function loop() {
  raf = requestAnimationFrame(loop);
  const amb = performance.now() / 1000;
  // 음악이 재생 중이면 화면 시간을 음악 시간에 맞춰 보정
  if (state === 'play' && running && !bgm.paused && !bgm.seeking && bgm.currentTime > 0.05) {
    const d = bgm.currentTime - clock(); if (Math.abs(d) > 0.08) perf0 -= d * 1000;
  }
  const t = FIXED_T != null ? FIXED_T : state === 'gate' ? -1 : clock();
  render(t, amb);
  if (t >= T_FIN + 2.4 && !cta.classList.contains('show')) { placeCTA(); cta.classList.add('show'); }
  const tip = state === 'play' && running && FIXED_T == null && CONFIG.sound && !muted && bgm.paused && t > 1.2 && t < T_FIN;
  if (tip !== soundTip.classList.contains('on')) soundTip.classList.toggle('on', tip);
}
function begin() {
  if (state !== 'gate') return;
  state = 'play'; running = false;
  gate.classList.add('hide'); hud.classList.add('on');
  if (CONFIG.sound) {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    try { bgm.currentTime = 0; } catch (e) {}
    playAt(0);
    holdTimer = setTimeout(() => go(false), 700);   // 소리가 늦거나 막혀도 0.7초 뒤엔 화면 시작
  } else go(false);
}
function finish() {
  if (state === 'done') return;
  state = 'done';
  try { bgm.pause(); } catch (e) {}
  hud.classList.remove('on'); cta.classList.remove('show'); soundTip.classList.remove('on');
  intro.classList.add('done');
  window.dispatchEvent(new CustomEvent('intro:finished'));
  try { if (window.parent !== window) window.parent.postMessage({ type: 'intro:finished' }, '*'); } catch (e) {}
  if (CONFIG.nextUrl) setTimeout(() => { location.href = CONFIG.nextUrl; }, 650);
  setTimeout(() => { cancelAnimationFrame(raf); raf = 0; }, 900);
}
function restart() {
  intro.classList.remove('done'); gate.classList.remove('hide'); cta.classList.remove('show');
  state = 'gate'; running = false; if (!raf) loop();
}
startBtn.addEventListener('click', begin);
skipBtn.addEventListener('click', finish);
cta.addEventListener('click', finish);
cta.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); finish(); } });
muteBtn.addEventListener('click', () => { muted = !muted; muteBtn.textContent = muted ? 'SOUND OFF' : 'SOUND ON'; bgm.muted = muted; if (!muted) wake(); });
['pointerdown', 'touchend'].forEach(ev => window.addEventListener(ev, wake, { passive: true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
replay.addEventListener('click', restart);
window.addEventListener('keydown', e => {
  if (state === 'gate' && !startBtn.disabled && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); begin(); }
  else if (state === 'play' && e.key === 'Escape') finish();
});
window.addEventListener('resize', resize);
window.__audioState = () => ({ paused: bgm.paused, time: +bgm.currentTime.toFixed(2), clock: +clock().toFixed(2), dur: bgm.duration, err: bgm.error && bgm.error.code });
window.__renderAt = t => { FIXED_T = t; render(t, 0); };

async function loadFonts() {
  if (!document.fonts || !document.fonts.load) return;
  const krText = [CONFIG.title, ...CONFIG.titlePortrait, ...[].concat(CONFIG.tagline), CONFIG.achievement, '이 게임들을 만든 개발자들', ...C.map(c => c.name)].join('');
  const monoText = BOOT_LINES.map(l => l.s).join('') + CODE.join('');
  try {
    await Promise.race([
      Promise.all([
        document.fonts.load(`400 64px "Black Han Sans"`, krText),
        document.fonts.load(`900 64px "Orbitron"`, 'PLAYER0123456789'), document.fonts.load(`700 64px "Orbitron"`, 'ABC'),
        document.fonts.load(`700 20px "Nanum Gothic Coding"`, monoText), document.fonts.load(`400 20px "Nanum Gothic Coding"`, 'abc'),
      ]),
      new Promise(r => setTimeout(r, 3000)),
    ]);
  } catch (e) {}
  let ok = false; document.fonts.forEach(f => { if (f.family.replace(/["']/g, '') === 'Black Han Sans' && f.status === 'loaded') ok = true; });
  KRW = ok ? 400 : 900;
}

resize();
loop();
loadFonts().then(() => {
  G = {}; TC.clear(); placeCTA();
  startBtn.disabled = false; startBtn.textContent = 'PRESS START';
  if (FIXED_T != null) { gate.classList.add('hide'); state = 'play'; }
});
})();
</script>

<!-- 게임 선택 화면 만들기 -->
<script>
/* =====================================================================
   게임 목록 — 순서대로 CONFIG.creators(학생 이름·색)와 짝지어집니다.
   게임을 바꾸려면 file(파일 이름)과 title(게임 이름)만 고치면 돼요.
   ===================================================================== */
const GAMES = [
  { file: 'game1_chanwoo.html',  title: '어비스 레기온' },
  { file: 'game2_youngseo.html', title: 'KARMA' },
  { file: 'game3_hyunjun.html',  title: '부스터 레이스' },
  { file: 'game4_myungjin.html', title: 'MY LITTLE ISLAND' },
  { file: 'game5_seohu.html',    title: '바다의 낚시 왕' },
  { file: 'game6_heerak.html',   title: '탐정메모리즈' },
];

(() => {
'use strict';
const app = document.getElementById('app');
const grid = document.getElementById('lbGrid');
const creators = (typeof CONFIG !== 'undefined' && CONFIG.creators) || [];
const qs = new URLSearchParams(location.search);
const direct = qs.has('lobby');

/* 인트로와 똑같은 픽셀 캐릭터 (이름으로 모양이 정해짐) */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, k) { const A = hex2rgb(a), B = hex2rgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join(''); }
function makeSprite(seedStr) {
  const r = mulberry32(hashStr(seedStr)); const N = 9;
  const g = [...Array(N)].map(() => Array(N).fill(0));
  for (let y = 0; y < N; y++) for (let x = 0; x < 5; x++) {
    const p = 0.78 - 0.5 * ((4 - x) / 4) - 0.18 * (Math.abs(y - 4) / 4);
    const v = r() < p ? (r() < 0.24 ? 2 : 1) : 0; g[y][x] = v; g[y][N - 1 - x] = v;
  }
  for (let y = 2; y <= 6; y++) for (let x = 3; x <= 5; x++) g[y][x] = g[y][x] || 1;
  const ey = 3, ex = r() < 0.5 ? 2 : 3;
  for (let y = ey - 1; y <= ey + 1; y++) for (let x = ex - 1; x <= ex + 1; x++) { g[y][x] = g[y][x] || 1; g[y][N - 1 - x] = g[y][N - 1 - x] || 1; }
  g[ey][ex] = 3; g[ey][N - 1 - ex] = 3;
  if (r() < 0.6) { g[N - 1][1] = g[N - 1][7] = 1; g[N - 1][3] = g[N - 1][5] = 0; }
  return g;
}
function drawSprite(cv, seed, col) {
  const g = makeSprite(seed), N = 9, cs = 10, pad = 2;
  cv.width = cv.height = N * cs + pad * 2;
  const x = cv.getContext('2d'), light = mix(col, '#ffffff', 0.5), dark = mix(col, '#000000', 0.55), s = cs * 0.92, o = (cs - s) / 2;
  for (let pass = 0; pass < 2; pass++) for (let yy = 0; yy < N; yy++) for (let xx = 0; xx < N; xx++) {
    const v = g[yy][xx]; if (!v) continue;
    const px = pad + xx * cs + o, py = pad + yy * cs + o;
    if (pass === 0) { x.fillStyle = dark; x.fillRect(px + cs * 0.16, py + cs * 0.16, s, s); continue; }
    x.fillStyle = v === 1 ? col : v === 2 ? light : '#ffffff'; x.fillRect(px, py, s, s);
    if (v === 3) { x.fillStyle = '#0b0320'; x.fillRect(px + s * 0.3, py + s * 0.35, s * 0.42, s * 0.5); }
  }
}

/* 카드 만들기 */
GAMES.forEach((gm, i) => {
  const c = creators[i] || { name: '', en: '', color: '#ffffff' };
  const num = String(i + 1).padStart(2, '0');
  const li = document.createElement('li'); li.style.setProperty('--i', i);
  const a = document.createElement('a');
  a.className = 'lb-card'; a.href = gm.file; a.style.setProperty('--c', c.color);
  a.setAttribute('aria-label', `${gm.title} — ${c.name} 제작`);
  a.innerHTML = `<span class="lb-num" aria-hidden="true">${num}</span>
    <span class="lb-sprite" aria-hidden="true"><canvas></canvas></span>
    <span class="lb-info"><span class="lb-player">PLAYER ${num}</span><strong class="lb-game"></strong>
      <span class="lb-maker"><span class="lb-name"></span><em>${c.en}</em></span></span>
    <span class="lb-play" aria-hidden="true">▶</span>`;
  a.querySelector('.lb-game').textContent = gm.title;
  a.querySelector('.lb-name').textContent = c.name;
  drawSprite(a.querySelector('canvas'), c.name + c.en, c.color);
  a.addEventListener('click', e => {
    if (a.classList.contains('soon')) { e.preventDefault(); return; }
    // 게임에서 '뒤로 가기'를 눌러도 인트로가 아니라 이 목록으로 돌아오게
    try { history.replaceState(null, '', location.pathname + '?lobby=1'); } catch (err) {}
  });
  li.appendChild(a); grid.appendChild(li);
  // 웹에 올렸을 때: 아직 파일이 없는 게임은 '준비 중'으로 표시
  if (/^https?:$/.test(location.protocol)) {
    fetch(gm.file, { method: 'HEAD', cache: 'no-store' }).then(r => {
      if (!r.ok) { a.classList.add('soon'); a.removeAttribute('href'); a.querySelector('.lb-play').textContent = '준비 중'; }
    }).catch(() => {});
  }
});

/* 인트로가 끝나면 카드 등장 */
const show = () => { app.classList.remove('lb-in'); void app.offsetWidth; app.classList.add('lb-in'); app.scrollTop = 0; };
window.addEventListener('intro:finished', show);
document.getElementById('replay').addEventListener('click', () => {
  document.documentElement.classList.remove('lobby-direct');
  app.classList.remove('lb-in');
});

/* index.html?lobby=1 → 인트로 없이 바로 게임 목록 (각 게임의 '대문으로' 버튼이 이 주소로 옵니다) */
if (direct) {
  const skip = document.getElementById('skipBtn');
  if (skip) skip.click(); else show();
}
// 뒤로 가기로 돌아왔을 때(페이지 캐시) 카드가 안 보이는 일 방지
window.addEventListener('pageshow', e => { if (e.persisted && document.getElementById('intro').classList.contains('done')) app.classList.add('lb-in'); });
})();
</script>
</body>
