<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05010f">
<title>우리가 만든 게임 · ARCADE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic+Coding:wght@400;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#05010f;color:#fff;overflow-x:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;
    font-family:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
  /* ───────── 인트로 전체 ───────── */
  #intro{position:fixed;inset:0;z-index:9999;transition:opacity .8s ease,visibility .8s ease;
    background:radial-gradient(ellipse at 50% 45%,#1a0836 0%,#05010f 60%)}
  #stage{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:var(--sw,100vw);overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,.6)}
  #intro.done{opacity:0;visibility:hidden;pointer-events:none}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  #gate{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;text-align:center;transition:opacity .45s ease;padding:24px;white-space:nowrap}
  #gate.hide{opacity:0;pointer-events:none}
  .coin{font-family:Orbitron,sans-serif;font-weight:700;letter-spacing:.45em;color:#ffd400;
    font-size:min(15px,calc(var(--sw) * .036));text-shadow:0 0 12px #ffd400;animation:blink 1.1s steps(2,start) infinite;padding-left:.45em}
  #startBtn{font-family:Orbitron,sans-serif;font-weight:900;letter-spacing:.22em;color:#fff;
    font-size:min(26px,calc(var(--sw) * .058));padding:.8em 1.3em .8em 1.5em;border-radius:16px;cursor:pointer;
    background:rgba(12,4,32,.55);border:2px solid #ff2e88;text-shadow:0 0 12px #ff2e88;
    box-shadow:0 0 26px rgba(255,46,136,.75),inset 0 0 22px rgba(255,46,136,.35);animation:pulse 1.2s ease-in-out infinite}
  #startBtn:disabled{opacity:.45;animation:none;cursor:wait}
  .hint{font-size:min(15px,calc(var(--sw) * .038));text-shadow:0 1px 6px #05010f,0 0 2px #05010f;color:#b9bdf0;opacity:.85;letter-spacing:.04em}

  #hud{position:absolute;z-index:4;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));
    display:flex;gap:8px;opacity:0;pointer-events:none;transition:opacity .4s;white-space:nowrap}
  #hud.on{opacity:1;pointer-events:auto}
  .hbtn{font-family:Orbitron,sans-serif;font-weight:700;font-size:min(11px,calc(var(--sw) * .027));letter-spacing:.14em;color:#fff;cursor:pointer;
    background:rgba(10,4,30,.45);border:1px solid rgba(255,255,255,.3);padding:7px 11px;border-radius:999px;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .hbtn:hover{border-color:#fff;background:rgba(255,255,255,.12)}

  #cta{position:absolute;z-index:4;left:50%;top:80%;transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:#fff;text-decoration:none;white-space:nowrap;
    padding:calc(var(--sw) * .032) calc(var(--sw) * .085) calc(var(--sw) * .028);border-radius:18px;border:3px solid transparent;
    background:linear-gradient(#0d0626,#0d0626) padding-box,
               linear-gradient(90deg,#ff2e88,#ffd400,#7cff4f,#00e5ff,#b26bff,#ff2e88) border-box;
    background-size:100% 100%,200% 100%;
    transition:opacity .5s ease,transform .7s cubic-bezier(.2,1.7,.4,1)}
  #cta.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto;
    animation:flow 2.2s linear infinite,ctaGlow 1s ease-in-out infinite}
  #cta .big{font-family:"Black Han Sans",sans-serif;font-size:min(30px,calc(var(--sw) * .072));letter-spacing:.04em}
  #cta .small{font-family:Orbitron,sans-serif;font-weight:900;font-size:min(12px,calc(var(--sw) * .028));letter-spacing:.42em;color:#ffd400;padding-left:.42em}

  @keyframes blink{to{visibility:hidden}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06);box-shadow:0 0 44px rgba(255,46,136,.95),inset 0 0 26px rgba(255,46,136,.5)}}
  @keyframes flow{to{background-position:0 0,200% 0}}
  @keyframes ctaGlow{0%,100%{box-shadow:0 0 18px rgba(0,229,255,.45),0 0 40px rgba(255,46,136,.25)}50%{box-shadow:0 0 34px rgba(0,229,255,.9),0 0 70px rgba(255,46,136,.5)}}

  /* ───────── 게임 선택 로비 화면 ───────── */
  #app{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:max(28px,env(safe-area-inset-top)) 18px max(32px,env(safe-area-inset-bottom));box-sizing:border-box;
    background:radial-gradient(circle at 50% 20%,#1f0b42,#05010f 75%)}
  .lobby-wrap{width:100%;max-width:480px;display:flex;flex-direction:column;gap:18px}
  .lobby-head{text-align:center}
  .lobby-sub{font-family:Orbitron,sans-serif;font-size:11px;letter-spacing:.35em;color:#00e5ff;margin-bottom:6px}
  .lobby-title{margin:0;font-size:clamp(28px,7vw,38px);font-weight:400;
    background:linear-gradient(90deg,#ff2e88,#ffd400,#7cff4f,#00e5ff,#b26bff);-webkit-background-clip:text;color:transparent}
  .lobby-desc{margin:6px 0 0;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:13px;color:#b9bdf0}

  .game-list{display:flex;flex-direction:column;gap:12px}
  .gcard{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;border-radius:16px;
    text-decoration:none;color:#fff;background:rgba(16,8,38,.85);border:2px solid var(--c,#ff2e88);
    box-shadow:0 0 20px color-mix(in srgb, var(--c) 30%, transparent);transition:transform .15s,box-shadow .15s}
  .gcard:not(.soon):active{transform:scale(.98)}
  .gcard:not(.soon):hover{transform:translateY(-2px);box-shadow:0 0 28px color-mix(in srgb, var(--c) 55%, transparent)}
  .gcard.soon{opacity:.48;border-style:dashed;cursor:default;box-shadow:none}
  .ginfo{display:flex;flex-direction:column;gap:4px;min-width:0}
  .gcreator{font-size:12px;color:var(--c);letter-spacing:.04em;display:flex;align-items:center;gap:6px}
  .gcreator span{font-family:Orbitron,sans-serif;font-size:10px;opacity:.8}
  .gtitle{font-size:20px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gbadge{font-family:Orbitron,sans-serif;font-weight:900;font-size:11px;letter-spacing:.12em;padding:8px 12px;border-radius:10px;
    background:var(--c);color:#090218;white-space:nowrap;flex-shrink:0}
  .gcard.soon .gbadge{background:rgba(255,255,255,.12);color:#b9bdf0}

  #replay{align-self:center;margin-top:6px;font-family:Orbitron,sans-serif;font-size:11px;letter-spacing:.18em;
    color:#b9bdf0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:9px 18px;cursor:pointer}
  #replay:hover{color:#fff;border-color:#fff}
</style>
</head>
<body>

<main id="app">
  <div class="lobby-wrap">
    <div class="lobby-head">
      <div class="lobby-sub">SELECT YOUR GAME</div>
      <h1 class="lobby-title">우리가 만든 게임</h1>
      <p class="lobby-desc">플레이할 게임을 선택하세요</p>
    </div>

    <div class="game-list" id="gameList"></div>

    <button id="replay" type="button">↺ INTRO REPLAY</button>
  </div>
</main>

<div id="intro" aria-label="우리가 만든 게임 인트로">
  <div id="stage">
  <canvas id="cv"></canvas>
  <div id="gate">
    <div class="coin">INSERT COIN</div>
    <button id="startBtn" type="button" disabled>LOADING…</button>
    <div class="hint">🔊 소리를 켜고 보면 더 신나요</div>
  </div>
  <div id="hud">
    <button class="hbtn" id="muteBtn" type="button" aria-label="소리 끄기/켜기">SOUND ON</button>
    <button class="hbtn" id="skipBtn" type="button">SKIP ▸▸</button>
  </div>
  <a id="cta" role="button" tabindex="0"><span class="big">게임하러 가기</span><span class="small">PRESS START</span></a>
  </div>
</div>

<script>
const CONFIG = Object.assign({
  title: '우리가 만든 게임',
  titlePortrait: ['우리가 만든', '게임'],
  subtitle: 'STUDENT GAME ARCADE',
  tagline: ['바이브코딩으로 탄생한', '학생 개발자들의 게임 세계'],
  achievement: '나만의 게임 완성 · 크리에이터 등극',
  creators: [
    { name: '찬우', en: 'CHANWOO',  color: '#ff2e88', gameTitle: '게임 준비 중', url: '' },
    { name: '영서', en: 'YOUNGSEO', color: '#00e5ff', gameTitle: '게임 준비 중', url: '' },
    { name: '현준', en: 'HYUNJUN',  color: '#ffd400', gameTitle: '게임 준비 중', url: '' },
    { name: '명진', en: 'MYUNGJIN', color: '#7cff4f', gameTitle: '게임 준비 중', url: '' },
    { name: '서후', en: 'SEOHU',    color: '#b26bff', gameTitle: '바다의 낚시왕 통영', url: 'game1.html' },
  ],
  nextUrl: '',
  sound: true,
  volume: 0.6,
}, window.INTRO_CONFIG || {});

(function renderLobby() {
  const list = document.getElementById('gameList');
  CONFIG.creators.forEach((c, idx) => {
    const ready = Boolean(c.url);
    const el = document.createElement(ready ? 'a' : 'div');
    el.className = 'gcard' + (ready ? '' : ' soon');
    el.style.setProperty('--c', c.color);
    if (ready) el.href = c.url;
    el.innerHTML = `
      <div class="ginfo">
        <div class="gcreator">P${idx + 1} · ${c.name} <span>${c.en}</span></div>
        <div class="gtitle">${c.gameTitle || '게임 준비 중'}</div>
      </div>
      <div class="gbadge">${ready ? 'PLAY ▶' : 'SOON'}</div>
    `;
    list.appendChild(el);
  });
})();

(() => {
'use strict';
const C = CONFIG.creators;
const COLORS = C.map(c => c.color);
const BPM = 120, BEAT = 60 / BPM, BAR = BEAT * 4;
const qs = new URLSearchParams(location.search);
let FIXED_T = qs.has('t') ? parseFloat(qs.get('t')) : null;
const DEBUG = qs.has('debug');

const F = {
  kr: '"Black Han Sans","Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif',
  en: '"Orbitron","Arial Black","Noto Sans KR",sans-serif',
  mono: '"Nanum Gothic Coding","Noto Sans Mono CJK KR","D2Coding",monospace',
};
let KRW = 900;

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const frac = x => x - Math.floor(x);
const E = {
  inQuad: x => x * x, outQuad: x => 1 - (1 - x) * (1 - x),
  inCubic: x => x * x * x, outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outBackBig: x => { const c1 = 2.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const ihash = n => (Math.imul(n | 0, 2654435761) >>> 0);
function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgba(h, a) { const [r, g, b] = hex2rgb(h); return `rgba(${r},${g},${b},${a})`; }
function mix(a, b, k) { const A = hex2rgb(a), B = hex2rgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join(''); }
function gradAt(cols, k) { k = clamp(k) * (cols.length - 1); const i = Math.min(cols.length - 2, Math.floor(k)); return mix(cols[i], cols[i + 1], k - i); }
const beatPulse = t => Math.exp(-frac(t / BEAT) * 6);

const intro = document.getElementById('intro');
const stage = document.getElementById('stage');
const cv = document.getElementById('cv');
const octx = cv.getContext('2d');
const sc = document.createElement('canvas'); const sctx = sc.getContext('2d');
const ly = document.createElement('canvas'); const lctx = ly.getContext('2d');
const mctx = document.createElement('canvas').getContext('2d');
let ctx = sctx;
let W = 0, H = 0, DPR = 1, S = 0, PORT = false;
let G = {};
const TC = new Map();

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const vw = Math.max(1, window.innerWidth), vh = Math.max(1, window.innerHeight);
  H = vh; W = Math.min(vw, Math.round(vh * 0.6));
  S = Math.min(W, H); PORT = true;
  stage.style.width = W + 'px'; intro.style.setProperty('--sw', W + 'px');
  for (const c of [cv, sc, ly]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  G = {}; TC.clear();
  placeCTA();
}

function textImg(text, size, fam, o = {}) {
  size = Math.max(4, Math.round(size));
  const key = text + '|' + size + '|' + fam + '|' + JSON.stringify(o);
  let c = TC.get(key); if (c) return c;
  const fnt = `${o.w || 900} ${size}px ${fam}`;
  mctx.font = fnt;
  const chars = [...text]; const sp = (o.sp || 0) * size;
  const ws = chars.map(ch => mctx.measureText(ch).width);
  const tw = sp ? ws.reduce((a, b) => a + b, 0) + sp * (chars.length - 1) : mctx.measureText(text).width;
  const ext = Math.ceil((o.glow || 0) * 1.6 + (o.sw || 0) * size + (o.hard ? Math.max(Math.abs(o.hard.dx), Math.abs(o.hard.dy)) * size : 0) + (o.ow || 0) + 4);
  const cw = Math.ceil(tw + ext * 2), ch = Math.ceil(size * 1.4 + ext * 2);
  c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(cw * DPR)); c.height = Math.max(1, Math.ceil(ch * DPR));
  const x = c.getContext('2d'); x.scale(DPR, DPR); x.font = fnt; x.textBaseline = 'middle'; x.textAlign = 'left'; x.lineJoin = 'round';
  const ox = ext, oy = ch / 2 + size * 0.03;
  const draw = (fn, dx = 0, dy = 0) => { if (!sp) { fn(text, ox + dx, oy + dy); return; } let px = ox + dx; chars.forEach((chr, i) => { fn(chr, px, oy + dy); px += ws[i] + sp; }); };
  const fillT = (s, a, b) => x.fillText(s, a, b), strokeT = (s, a, b) => x.strokeText(s, a, b);
  let fill = o.fill || '#fff';
  if (Array.isArray(fill)) { const g = x.createLinearGradient(ox, 0, ox + tw, 0); fill.forEach((col, i) => g.addColorStop(i / (fill.length - 1), col)); fill = g; }
  if (o.hard) { x.fillStyle = o.hard.c; x.strokeStyle = o.hard.c; if (o.sw) { x.lineWidth = o.sw * size * 2; draw(strokeT, o.hard.dx * size, o.hard.dy * size); } draw(fillT, o.hard.dx * size, o.hard.dy * size); }
  if (o.glow) { x.save(); x.shadowColor = o.gc || '#fff'; x.shadowBlur = o.glow * DPR; x.fillStyle = o.fill === 'none' ? 'rgba(0,0,0,0)' : fill; if (o.fill === 'none') { x.strokeStyle = o.outline; x.lineWidth = o.ow || 2; draw(strokeT); } else draw(fillT); x.restore(); }
  if (o.sw && o.stroke) { x.strokeStyle = o.stroke; x.lineWidth = o.sw * size * 2; draw(strokeT); }
  if (o.fill !== 'none') { x.fillStyle = fill; draw(fillT); }
  if (o.outline) { x.strokeStyle = o.outline; x.lineWidth = o.ow || 2; draw(strokeT); }
  c.cw = cw; c.ch = ch; c.tw = tw; c.ext = ext;
  if (TC.size > 600) TC.clear();
  TC.set(key, c); return c;
}
const fitS = (img, maxW, s = 1) => Math.min(s, maxW / Math.max(1, img.tw));
function leftOf(c, x, align, s) { return align === 'c' ? x - c.cw * s / 2 : align === 'l' ? x - c.ext * s : x - (c.ext + c.tw) * s; }
function dimg(c, x, y, align = 'c', a = 1, s = 1, reveal = 1) {
  if (a <= 0.003 || reveal <= 0) return;
  const w = c.cw * s, h = c.ch * s, L = leftOf(c, x, align, s);
  const prev = ctx.globalAlpha; ctx.globalAlpha = prev * clamp(a);
  if (reveal >= 1) ctx.drawImage(c, L, y - h / 2, w, h);
  else { const k = (c.ext + c.tw * reveal) / c.cw; ctx.drawImage(c, 0, 0, c.width * k, c.height, L, y - h / 2, w * k, h); }
  ctx.globalAlpha = prev;
}
function gtext(text, size, fam, o, x, y, align, a, s, amt, seed) {
  const base = textImg(text, size, fam, o);
  if (amt < 0.01) { dimg(base, x, y, align, a, s); return; }
  const tint = col => textImg(text, size, fam, { w: o.w, sp: o.sp, fill: col });
  const r = mulberry32(seed);
  const off = amt * S * 0.022;
  const prev = ctx.globalAlpha;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  dimg(tint('#ff1050'), x - off, y, align, a * 0.85 * Math.min(1, amt * 2), s);
  dimg(tint('#00e5ff'), x + off, y + off * 0.25, align, a * 0.85 * Math.min(1, amt * 2), s);
  ctx.restore();
  const w = base.cw * s, h = base.ch * s, L = leftOf(base, x, align, s), top = y - h / 2, n = 7;
  ctx.globalAlpha = prev * a;
  for (let i = 0; i < n; i++) {
    const o2 = r() < 0.5 ? (r() - 0.5) * 2 * amt * w * 0.12 : 0;
    ctx.drawImage(base, 0, i * base.height / n, base.width, base.height / n, L + o2, top + i * h / n, w, h / n + 0.5);
  }
  ctx.globalAlpha = prev;
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function makeSprite(seedStr) {
  const r = mulberry32(hashStr(seedStr)); const N = 9;
  const g = [...Array(N)].map(() => Array(N).fill(0));
  for (let y = 0; y < N; y++) for (let x = 0; x < 5; x++) {
    const p = 0.78 - 0.5 * ((4 - x) / 4) - 0.18 * (Math.abs(y - 4) / 4);
    const v = r() < p ? (r() < 0.24 ? 2 : 1) : 0; g[y][x] = v; g[y][N - 1 - x] = v;
  }
  for (let y = 2; y <= 6; y++) for (let x = 3; x <= 5; x++) g[y][x] = g[y][x] || 1;
  const ey = 3, ex = r() < 0.5 ? 2 : 3;
  for (let y = ey - 1; y <= ey + 1; y++) for (let x = ex - 1; x <= ex + 1; x++) { g[y][x] = g[y][x] || 1; g[y][N - 1 - x] = g[y][N - 1 - x] || 1; }
  g[ey][ex] = 3; g[ey][N - 1 - ex] = 3;
  if (r() < 0.6) { g[N - 1][1] = g[N - 1][7] = 1; g[N - 1][3] = g[N - 1][5] = 0; }
  return g;
}
const SPRITES = C.map(c => makeSprite(c.name + c.en));
const LIGHT = COLORS.map(c => mix(c, '#ffffff', 0.5));
const DARK = COLORS.map(c => mix(c, '#000000', 0.55));
function drawSprite(k, cx, cy, size, appear = 2, t = 0) {
  const g = SPRITES[k], N = 9, cs = size / N, col = COLORS[k];
  for (let pass = 0; pass < 2; pass++) {
    const r = mulberry32(k * 101 + 7);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const d = r() * 0.6; const v = g[y][x]; if (!v) continue;
      const p = appear >= 2 ? 1 : E.outBack(clamp((appear - d) / 0.5)); if (p <= 0) continue;
      const s = cs * p * 0.92, px = cx + (x - N / 2) * cs + (cs - s) / 2, py = cy + (y - N / 2) * cs + (cs - s) / 2;

  fw(t) { this.tone('sine', 500, t - 0.45, 0.45, 0.035, { to: 1500, a: 0.05, dest: this.sfx }); this.noise(t, 0.6, 0.32, { type: 'lowpass', f: 1800, fTo: 180, dest: this.sfx }); for (let k = 0; k < 9; k++) this.noise(t + 0.15 + Math.random() * 0.7, 0.03, 0.07, { type: 'highpass', f: 6000, dest: this.sfx }); }

  build() {
    const ev = [], at = (t, f) => ev.push([t, f]);
    const CH = { Am: { r: 45, pad: [57, 60, 64], arp: [69, 72, 76, 81] }, F: { r: 41, pad: [57, 60, 65], arp: [65, 69, 72, 77] },
      C: { r: 48, pad: [55, 60, 64], arp: [64, 67, 72, 76] }, G: { r: 43, pad: [55, 59, 62], arp: [67, 71, 74, 79] } };
    const ARP = [0, 1, 2, 3, 2, 1, 0, 1, 0, 1, 2, 3, 3, 2, 1, 2], BASS = [0, 0, 12, 0, 0, 12, 7, 12];
    const bar = (t0, ch, o) => {
      const c = CH[ch];
      if (o.pad) at(t0, s => this.pad(s, c.pad, BAR * 0.98, o.pad));
      if (o.bassLong) at(t0, s => this.bass(s, c.r, BAR * 0.95, 0.9));
      if (o.bass) for (let k = 0; k < 8; k++) at(t0 + k * BEAT / 2, s => this.bass(s, c.r + BASS[k], BEAT / 2 * 0.9));
      if (o.arp) for (let k = 0; k < 16; k++) at(t0 + k * BEAT / 4, s => this.arp(s, c.arp[ARP[k]], o.arp));
      if (o.kick) for (let k = 0; k < (o.kickN || 4); k++) at(t0 + k * BEAT, s => this.kick(s));
      if (o.snare) [1, 3].forEach(k => at(t0 + k * BEAT, s => this.snare(s)));
      if (o.hat) for (let k = 0; k < 8; k++) at(t0 + k * BEAT / 2, s => this.hat(s, k % 2 ? 1 : 0.6, o.open && k % 2 === 1));
    };
    const roll = (t0, t1, n) => { for (let k = 0; k < n; k++) { const tt = lerp(t0, t1, k / n); at(tt, s => this.snare(s, 0.3 + 0.7 * k / n)); } };

    at(0.02, s => { this.tone('square', 80, s, 0.3, 0.05, { to: 1400, dest: this.sfx }); this.noise(s, 0.08, 0.2, { type: 'highpass', f: 3000, dest: this.sfx }); });
    at(0.3, s => { this.tone('sawtooth', 55, s, 3.7, 0.06, { a: 1.2, sus: 0.85, lp: 180, lpTo: 1400 }); this.tone('sawtooth', 82.4, s, 3.7, 0.04, { a: 1.2, sus: 0.85, lp: 180, lpTo: 1400 }); });
    BOOT_LINES.forEach(L => { const n = [...L.s].length; for (let k = 0; k < n; k += 2) at(L.t + k / CPS, s => this.blip(s, 1500 + Math.random() * 1000, 0.8, 0.022)); });
    { const L = BOOT_LINES[3], tEnd = L.t + [...L.s].length / CPS; for (let k = 0; k < 14; k++) at(tEnd + 0.05 + 0.55 * E.outCubic(k / 14) , s => this.blip(s, 600 + k * 70, 0.9, 0.03)); }
    { const L = BOOT_LINES[4]; at(L.t + [...L.s].length / CPS, s => this.jingle(s, 76)); }
    at(2.9, s => this.riser(s, 1.1));
    at(4.0, s => this.impact(s, 1));
    bar(4, 'Am', { pad: 1, bassLong: 1 });
    for (let k = 0; k < 22; k++) at(4.15 + k * 0.08, s => this.blip(s, 900 + k * 90, 0.6, 0.03));
    at(6.0, s => { this.impact(s, 0.8); this.jingle(s + 0.02, 81); });
    bar(6, 'F', { pad: 1, bass: 1, arp: 0.8, kick: 1, hat: 1 });
    bar(8, 'C', { pad: 1, bass: 1, arp: 1, kick: 1, snare: 1, hat: 1 });
    at(6.9, s => this.noise(s, 0.8, 0.1, { type: 'highpass', f: 3000, fTo: 12000, a: 0.3, dest: this.sfx }));
    at(8.9, s => this.riser(s, 1.1, 0.9)); roll(9.5, 10, 8); at(9.35, s => this.whoosh(s, 1.2));
    const prog4 = ['Am', 'F', 'C', 'G'];
    for (let b = 0; b < 10; b++) bar(10 + b * 2, prog4[b % 4], { pad: 0.7, bass: 1, arp: 1, kick: 1, snare: 1, hat: 1, open: 1 });
    C.forEach((c, i) => {
      const s0 = T_PLAY + i * PER;
      at(s0, s => this.crash(s, 0.8));
      if (i > 0) at(s0 - 0.32, s => this.whoosh(s));
      for (let k = 0; k < 8; k++) at(s0 + 0.08 + k * 0.07, s => this.blip(s, 700 + k * 110, 0.5, 0.025));
      for (let k = 0; k < 9; k += 2) at(s0 + 0.12 + k * 0.034, s => this.blip(s, 2200, 0.5, 0.015));
      for (let k = 0; k < 6; k++) at(s0 + 0.3 + k * 0.07, s => this.blip(s, 300 + Math.random() * 1200, 0.45, 0.02));
      at(s0 + LOCK, s => { this.zap(s); this.kick(s, 0.9); this.crash(s, 0.5); });
      for (let r = 0; r < 3; r++) { const st = s0 + 1.15 + r * 0.22; for (let k = 0; k < 12; k++) at(st + 0.55 * (1 - Math.pow(1 - k / 12, 1 / 3)), s => this.blip(s, 500 + r * 120 + k * 55, 0.45, 0.02)); at(st + 0.56, s => this.tone(this.pw25, mf(88 + r * 2), s, 0.14, 0.04, { a: 0.002, dest: this.sfx })); }
      at(s0 + 1.9, s => this.jingle(s, 84 + (i % 2) * 3));
    });
    bar(30, 'Am', { pad: 0.8, bass: 1, arp: 0.8, kick: 1, snare: 1, hat: 1, open: 1 });
    bar(32, 'F', { pad: 0.8, bass: 1, arp: 0.8, kick: 1, snare: 1, hat: 1, open: 1 });
    bar(34, 'C', { pad: 1, arp: 0.9, kick: 1, kickN: 2 });
    for (let k = 0; k < 4; k++) at(34 + k * BEAT / 2, s => this.bass(s, 48 + BASS[k], BEAT / 2 * 0.9));
    roll(35.0, 36.0, 16); at(34.8, s => this.riser(s, 1.2, 1.1));
    at(30, s => this.crash(s, 0.9));
    const HOOK = [[0, 0, 1, 76], [0, 1, .5, 79], [0, 1.5, .5, 81], [0, 2, 1.5, 84], [0, 3.5, .5, 83], [1, 0, 1, 81], [1, 1, .5, 79], [1, 1.5, .5, 77], [1, 2, 2, 76], [2, 0, .5, 79], [2, .5, .5, 81], [2, 1, 1, 84]];
    HOOK.forEach(([b, bt, len, m]) => at(30 + b * BAR + bt * BEAT, s => this.leadN(s, m, len * BEAT * 0.95)));
    C.forEach((c, k) => at(30.35 + k * 0.15, s => this.tone(this.pw25, mf(72 + [0, 3, 7, 10, 12][k]), s, 0.2, 0.05, { a: 0.002, dest: this.sfx })));
    at(32.2, s => this.noise(s, 0.7, 0.12, { type: 'highpass', f: 4000, fTo: 14000, a: 0.25, dest: this.sfx }));
    at(36.0, s => { this.impact(s, 1.3); this.pad(s, [45, 52, 57, 60, 64, 71], 4.8, 1.5); this.bass(s, 33, 4, 1.1); });
    [69, 72, 76, 81, 84, 88].forEach((m, k) => at(36.0 + k * BEAT / 4, s => this.tone(this.pw25, mf(m), s, 0.16, 0.06, { a: 0.002 })));
    at(36.75, s => this.leadN(s, 81, 2.6, 1.1));
    at(36.0, s => this.kick(s)); at(36.5, s => this.hat(s, 1, true));
    FW.forEach(([ft]) => at(T_FIN + ft, s => this.fw(s)));
    at(38.4, s => this.jingle(s, 88));
    return ev.sort((a, b) => a[0] - b[0]);
  }
  start() { try { this.ctx.resume(); } catch (e) {} this.t0 = this.ctx.currentTime + 0.12; this.ev = this.build(); this.ix = 0; this.pump(); this.timer = setInterval(() => this.pump(), 25); }
  pump() {
    const now = this.ctx.currentTime - this.t0;
    while (this.ix < this.ev.length && this.ev[this.ix][0] < now + 0.2) { const [t, fn] = this.ev[this.ix++]; if (t >= now - 0.05) { try { fn(this.t0 + Math.max(t, now)); } catch (e) {} } }
    if (this.ix >= this.ev.length) clearInterval(this.timer);
  }
  running() { return this.ctx.state === 'running'; }
  time() { return this.ctx.currentTime - this.t0; }
  setMute(m) { this.master.gain.setTargetAtTime(m ? 0 : CONFIG.volume, this.ctx.currentTime, 0.05); }
  stop() { clearInterval(this.timer); try { this.master.gain.setTargetAtTime(0, this.ctx.currentTime, 0.12); } catch (e) {} setTimeout(() => { try { this.ctx.close(); } catch (e) {} }, 900); }
}

const gate = document.getElementById('gate'), startBtn = document.getElementById('startBtn');
const hud = document.getElementById('hud'), skipBtn = document.getElementById('skipBtn'), muteBtn = document.getElementById('muteBtn');
const cta = document.getElementById('cta'), replay = document.getElementById('replay');
let state = 'gate', audio = null, perf0 = 0, muted = false, raf = 0;

function placeCTA() { if (!W) return; const y = Math.min(H * 0.9, finLayout().cta); cta.style.top = y + 'px'; }
function clock() {
  if (audio && audio.running()) return audio.time();
  return (performance.now() - perf0) / 1000;
}
function loop() {
  raf = requestAnimationFrame(loop);
  const amb = performance.now() / 1000;
  const t = FIXED_T != null ? FIXED_T : state === 'gate' ? -1 : clock();
  render(t, amb);
  if (t >= T_FIN + 2.4 && !cta.classList.contains('show')) { placeCTA(); cta.classList.add('show'); }
}
function begin() {
  if (state !== 'gate') return;
  state = 'play';
  if (CONFIG.sound) { try { audio = new Synth(); audio.start(); audio.setMute(muted); } catch (e) { audio = null; } }
  perf0 = performance.now() + 120;
  gate.classList.add('hide'); hud.classList.add('on');
}
function finish() {
  if (state === 'done') return;
  state = 'done';
  if (audio) { audio.stop(); audio = null; }
  hud.classList.remove('on'); cta.classList.remove('show');
  intro.classList.add('done');
  window.dispatchEvent(new CustomEvent('intro:finished'));
  try { if (window.parent !== window) window.parent.postMessage({ type: 'intro:finished' }, '*'); } catch (e) {}
  if (CONFIG.nextUrl) setTimeout(() => { location.href = CONFIG.nextUrl; }, 650);
  setTimeout(() => { cancelAnimationFrame(raf); raf = 0; }, 900);
}
function restart() {
  location.href = 'index.html';
}
startBtn.addEventListener('click', begin);
skipBtn.addEventListener('click', finish);
cta.addEventListener('click', finish);
cta.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); finish(); } });
muteBtn.addEventListener('click', () => { muted = !muted; muteBtn.textContent = muted ? 'SOUND OFF' : 'SOUND ON'; if (audio) audio.setMute(muted); });
replay.addEventListener('click', restart);
window.addEventListener('keydown', e => {
  if (state === 'gate' && !startBtn.disabled && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); begin(); }
  else if (state === 'play' && e.key === 'Escape') finish();
});
window.addEventListener('resize', resize);
window.__renderAt = t => { FIXED_T = t; render(t, 0); };

async function loadFonts() {
  if (!document.fonts || !document.fonts.load) return;
  const krText = [CONFIG.title, ...CONFIG.titlePortrait, ...[].concat(CONFIG.tagline), CONFIG.achievement, '이 게임들을 만든 개발자들', ...C.map(c => c.name)].join('');
  const monoText = BOOT_LINES.map(l => l.s).join('') + CODE.join('');
  try {
    await Promise.race([
      Promise.all([
        document.fonts.load(`400 64px "Black Han Sans"`, krText),
        document.fonts.load(`900 64px "Orbitron"`, 'PLAYER0123456789'), document.fonts.load(`700 64px "Orbitron"`, 'ABC'),
        document.fonts.load(`700 20px "Nanum Gothic Coding"`, monoText), document.fonts.load(`400 20px "Nanum Gothic Coding"`, 'abc'),
      ]),
      new Promise(r => setTimeout(r, 3000)),
    ]);
  } catch (e) {}
  let ok = false; document.fonts.forEach(f => { if (f.family.replace(/["']/g, '') === 'Black Han Sans' && f.status === 'loaded') ok = true; });
  KRW = ok ? 400 : 900;
}

if (qs.get('lobby') === '1') {
  intro.style.display = 'none';
  state = 'done';
} else {
  resize();
  loop();
  loadFonts().then(() => {
    G = {}; TC.clear(); placeCTA();
    startBtn.disabled = false; startBtn.textContent = 'PRESS START';
    if (FIXED_T != null) { gate.classList.add('hide'); state = 'play'; }
  });
}
})();
</script>
