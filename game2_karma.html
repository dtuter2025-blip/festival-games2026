function openLv(){const pool=Object.keys(AB).filter(k=>(P.lv[k]||0)<5),o=[];while(o.length<3&&pool.length)o.push(pool.splice(Math.random()*pool.length|0,1)[0]);if(!o.length)o.push('heal');lvOpts=o;setS('lvl');$('lvs').textContent='레벨 '+P.lvl+' · 능력을 하나 고르세요 (키 1~3)';const box=$('lvc');box.innerHTML='';
o.forEach((k,i)=>{const d=document.createElement('div');d.className='card';d.style.width='170px';
if(k=='heal')d.innerHTML='<b>'+(i+1)+'. 회복</b>모든 능력이 최대입니다<i>체력 +2, 마나 전부 회복</i>';
else{const a=AB[k],cur=P.lv[k]||0,sy=SY.filter(s=>(s[0]==k||s[1]==k)&&(P.lv[s[0]==k?s[1]:s[0]]||0)==5&&cur==4);d.innerHTML='<b>'+(i+1)+'. '+a.n+'</b>'+(cur?'Lv '+cur+' → '+(cur+1)+(cur==4?' (MAX)':''):'새 능력')+'<i>'+a.d+'</i>'+sy.map(s=>'<i style="color:#ffd36a">시너지 완성: '+s[3]+'</i>').join('')}
d.onclick=()=>pick(k);box.appendChild(d)})}
function pick(k){if(S!='lvl')return;if(k=='heal'){P.hp=Math.min(P.hpMax,P.hp+2);P.mp=P.mpMax}else{P.lv[k]=(P.lv[k]||0)+1;let sm='';for(const s of SY)if(!P.syn[s[2]]&&(P.lv[s[0]]||0)>=5&&(P.lv[s[1]]||0)>=5){P.syn[s[2]]=1;sm='시너지 발동! '+s[3]+' : '+s[4]}recalc();if(k=='vital')P.hp=Math.min(P.hpMax,P.hp+1);if(k=='guard')P.sh=Math.min(P.shMax,P.sh+1);if(k=='mana')P.mp=Math.min(P.mpMax,P.mp+1);if(sm){setMsg(sm);msgT=4}}setS('play')}
addEventListener('keydown',e=>{if(S=='lvl'&&lvOpts[+e.key-1])pick(lvOpts[+e.key-1])});
const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
const PIL=[[200,240],[716,240],[200,400],[716,400],[458,320]];
function startRun(){E=[];PB=[];EB=[];HZ=[];FX=[];TR=[];PK=[];XP=[];PT=[];portal=null;boss=null;wave=0;stage=1;run={t:0,sp:.5,kills:0};OB=PIL.map(([x,y])=>({x,y,w:44,h:44}));P.x=WW/2;P.y=WH-90;for(let i=0;i<4;i++)spawnOne()}
function spawnOne(){const r=Math.random(),p=Math.min(.35,.1+wave*.03),k=r<p?'or':r<p+.3?'ar':'sl';let x,y,t=0;do{x=60+Math.random()*(WW-120);y=60+Math.random()*(WH-120)}while((Math.hypot(x-P.x,y-P.y)<260||hit({x,y,r:16}))&&t++<60);E.push(mkE(k,x,y))}
function spawnBoss(){const H=250*(1+.5*(run.bb||0));run.bb=(run.bb||0)+1;boss={k:'boss',boss:1,x:WW/2,y:150,r:34,hp:H,max:H,spawn:0,stun:0,kx:0,ky:0,flash:0,pull:0,act:null,cd:1.5,s:0,at:0,z:0,last:'',face:1,dead:0};E.push(boss);setMsg('보스 : 타락한 군주')}
function bossKilled(){boss=null;P.hp=Math.min(P.hpMax,P.hp+2);P.mp=P.mpMax;setMsg('보스 처치! 체력 +2')}
function runLogic(dt){run.t+=dt;weapons(dt);if(run.t>=900){end(1);return}const w=1+Math.floor(run.t/30);
if(w>wave){wave=w;stage=w;if(w%5==0&&!boss)spawnBoss();else setMsg('웨이브 '+w+(w==11||w==21?' · 몬스터가 더 강해졌습니다!':''))}
run.sp-=dt;const alive=E.filter(e=>!e.boss&&!e.dead).length;
if(run.sp<=0&&alive<Math.min(8+wave*2,36)){run.sp=Math.max(.35,1.6-wave*.1);spawnOne()}
for(const k of PK){k.t-=dt;if(P.hp<P.hpMax&&Math.hypot(P.x-k.x,P.y-k.y)<18){P.hp++;k.t=0;FL.push({x:P.x,y:P.y-20,t:.7,s:'+1',c:1})}}
for(const o of XP){o.t-=dt;const dx=P.x-o.x,dy=P.y-o.y,d=Math.hypot(dx,dy)||1;if(d<P.mg||o.near){o.near=1;const s=Math.min(d,380*dt);o.x+=dx/d*s;o.y+=dy/d*s}if(d<14){P.xp+=o.v;o.t=0;if(P.syn.alch)P.mp=Math.min(P.mpMax,P.mp+.3)}}
XP=XP.filter(o=>o.t>0);PK=PK.filter(k=>k.t>0);
const nd=5+3*(P.lvl-1);if(P.xp>=nd){P.xp-=nd;P.lvl++;openLv()}}

function newGame(){const c=CH[ci];P={c,i:ci,x:0,y:0,r:11,face:1,aim:-1.57,hp:c.hp,sh:c.sh,mp:c.mp,inv:0,sinceHit:9,shT:0,cd:0,combo:0,comboT:0,sT:0,guard:0,ammo:5,reload:0,shots:0,step:0};skillReq=0;resetBuild();startRun();$('sk').innerHTML=c.sk+'<br>마나 '+c.cost;if(tutOff())setS('play');else showTut()}
function hit(e){if(e.x<e.r+30||e.x>WW-e.r-30||e.y<e.r+30||e.y>WH-e.r-30)return 1;for(const o of OB)if(e.x>o.x-e.r&&e.x<o.x+o.w+e.r&&e.y>o.y-e.r&&e.y<o.y+o.h+e.r)return 1;return 0}
function mv(e,dx,dy){e.x+=dx;if(hit(e))e.x-=dx;e.y+=dy;if(hit(e))e.y-=dy}
function loadStage(){E=[];PB=[];EB=[];HZ=[];FX=[];TR=[];OB=[];portal=null;boss=null;wave=0;P.x=WW/2;P.y=WH-90;
if(stage<=3){for(let i=0;i<6+stage;i++){const w=40+Math.random()*50|0,h=40+Math.random()*40|0;OB.push({x:90+Math.random()*(WW-180-w)|0,y:90+Math.random()*(WH-290-h)|0,w,h})}spawnWave();setMsg('스테이지 '+stage)}
else{[[200,240],[716,240],[200,400],[716,400]].forEach(([x,y])=>OB.push({x,y,w:44,h:44}));boss={k:'boss',boss:1,x:WW/2,y:150,r:34,hp:250,max:250,spawn:0,stun:0,kx:0,ky:0,flash:0,pull:0,act:null,cd:1.5,s:0,at:0,z:0,last:'',face:1,dead:0};E.push(boss);setMsg('보스 : 타락한 군주')}}
function mkE(k,x,y,sh){const m=1+run.t/180,d={sl:[10,14*m,70],ar:[10,10*m,55],or:[14,30*m,48]}[k];return{k,x,y,r:d[0],hp:d[1],max:d[1],sp:d[2]*(1+Math.min(.5,run.t/1800)),spawn:.8,cdT:1+Math.random()*1.5,stun:0,kx:0,ky:0,flash:0,pull:0,sh,dead:0}}
function spawnWave(){wave++;wT=1;const n=2+stage*2;for(let i=0;i<n;i++){const r=Math.random(),k=r<.5?'sl':r<.8?'ar':'or';let x,y,t=0;do{x=60+Math.random()*(WW-120);y=60+Math.random()*(WH-120)}while((Math.hypot(x-P.x,y-P.y)<260||hit({x,y,r:16}))&&t++<60);E.push(mkE(k,x,y))}}
function hurt(n){if(P.inv>0||S!='play')return;P.inv=.8;P.sinceHit=0;let r=n;const s=Math.min(P.sh,r);P.sh-=s;r-=s;P.hp-=r;shake=6;FL.push({x:P.x,y:P.y-20,t:.7,s:'-'+n,r:1});if(P.hp<=0){if(P.syn.unyield&&P.reviveT<=0){P.hp=1;P.inv=2;P.reviveT=60;setMsg('불굴! 치명상을 버텼습니다')}else{P.hp=0;end(0)}}else if(P.syn.thorn){for(const e of E){const dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy)||1;if(d<110)hurtE(e,P.c.atk*1.5,0,dx/d,dy/d,450)}FX.push({k:'ring',x:P.x,y:P.y,r:110,t:.35,m:.35,col:'#ff9a6a'})}}
function hurtE(e,base,force,kx,ky,kb){if(e.spawn>0||e.dead)return;const c=force||Math.random()<P.cr,d=base*P.dm*(c?1+P.cdm:1);if(c&&P.syn.exec&&!e.boss&&e.hp-d<e.max*.25)e.hp=d;e.hp-=d;if(c&&P.syn.vamp&&P.hp<P.hpMax&&Math.random()<.1)P.hp++;e.flash=.12;burst(e.x,e.y,c?10:5,c?'#ffd23c':'#ffffff',c?300:200,3);if(c)shake=Math.max(shake,3);FL.push({x:e.x,y:e.y-e.r-6,t:.7,s:Math.max(1,Math.round(d))+(c?'!':''),c});if(kb&&!e.boss){e.kx=kx*kb;e.ky=ky*kb}if(e.hp<=0)kill(e)}
function kill(e){e.dead=1;run.kills++;burst(e.x,e.y,e.boss?60:18,e.boss?'#b070ff':e.sh?'#8a5cf5':e.k=='ar'?'#e8e4d8':e.k=='or'?'#7aa03a':'#58d858',e.boss?420:300,4);shake=Math.max(shake,e.boss?14:2);if(!e.boss&&Math.random()<.08)PK.push({x:e.x,y:e.y,t:12});const xv=e.boss?5+Math.round(run.t/60):Math.round({sl:1,ar:2,or:3}[e.k]*(1+run.t/300));for(let i=0;i<(e.boss?8:1);i++)XP.push({x:e.x+(Math.random()-.5)*20,y:e.y+(Math.random()-.5)*20,v:xv,t:40});if(P.syn.gale)P.rush=3;FX.push({k:'ring',x:e.x,y:e.y,r:e.boss?90:30,t:.4,m:.4,col:'#ffe9a0'});if(e.boss){EB=[];E.forEach(m=>m.dead=1);bossKilled()}}
function ebul(x,y,a,sp,dmg,col){EB.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:5,dmg:(dmg||1)*ED(),life:4,col:col||'#d070ff'})}
function ring(e,n,off,sp){for(let i=0;i<n;i++)ebul(e.x,e.y,off+i*6.2832/n,sp,1)}
function cone(rg,arc,base,kb,fc){for(const e of E){const dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy);if(d>rg+e.r)continue;if(arc<6.2&&Math.abs(angd(Math.atan2(dy,dx),P.aim))>arc/2&&d>e.r+8)continue;hurtE(e,base,fc,dx/d||0,dy/d||0,kb)}}
function mkB(o){return{pierce:0,fc:0,kb:60,hit:new Set(),vx:Math.cos(o.a)*o.sp,vy:Math.sin(o.a)*o.sp,...o}}
function attack(){const c=P.c,a=P.aim,i=P.i,ca=Math.cos(a),sa=Math.sin(a),bx=P.x+ca*20,by=P.y+sa*20;P.cd=1.9/(c.as*P.asm*(P.rush>0?1.4:1));P.atkN++;burst(P.x+ca*(i<2?50:26),P.y+sa*(i<2?50:26),i<2?12:6,c.col,i<2?260:180,3);if(P.syn.storm&&P.atkN%8==0){for(const e of E){const dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy)||1;if(d<130)hurtE(e,c.atk*2,0,dx/d,dy/d,300)}FX.push({k:'ring',x:P.x,y:P.y,r:130,t:.35,m:.35,col:'#ffe08a'})}const fx=o=>FX.push({x:P.x,y:P.y,a,f:1,...o});
if(i==0){P.comboT=1;const n=P.combo;P.combo=(n+1)%3;
if(n==0){cone(72,2.1,c.atk,150);fx({k:'arc',r:56,w:1,t:.18,m:.18,col:'#bfe0ff'})}
else if(n==1){cone(105,.55,c.atk*1.3,220);fx({k:'thr',r:105,t:.18,m:.18,col:'#e8f4ff'})}
else{cone(78,7,c.atk*1.6,300);fx({k:'spin',r:60,t:.28,m:.28,col:'#9cc4ff'})}}
else if(i==1){P.comboT=1.2;const n=P.combo;P.combo=(n+1)%2;
if(n==0){cone(62,1.5,c.atk*1.6,120);fx({k:'arc',r:50,w:.7,t:.2,m:.2,col:'#ffe08a'})}
else{cone(75,2.6,c.atk*.8,560);fx({k:'arc',r:66,w:1.3,t:.25,m:.25,col:'#fff2c0'})}}
else if(i==2){P.shots++;const fc=P.shots%7==0;PB.push(mkB({x:bx,y:by,a,sp:900,r:5,dmg:c.atk,fc:fc?1:0,pierce:99,life:.7,k:'sn',col:fc?'#ffffff':'#c9a0ff'}));FX.push({k:'flash',x:bx,y:by,r:12,t:.08,m:.08,col:'#d0a0ff'})}
else if(i==3){PB.push(mkB({x:bx,y:by,a,sp:620,r:6,dmg:c.atk,life:.45,k:'hook',kb:0}))}
else{for(let k=0;k<10;k++)PB.push(mkB({x:bx,y:by,a:a+(Math.random()-.5)*.7,sp:520+Math.random()*140,r:3,dmg:c.atk/5,life:.32,k:'pel',kb:80}));FX.push({k:'flash',x:bx+ca*8,y:by+sa*8,r:16,t:.08,m:.08,col:'#ffb040'});P.ammo--;if(P.ammo<=0)P.reload=1.5}}
function skill(){const c=P.c,a=P.aim,i=P.i,ca=Math.cos(a),sa=Math.sin(a),bx=P.x+ca*20,by=P.y+sa*20;burst(P.x,P.y,24,c.col,360,4);FX.push({k:'ring',x:P.x,y:P.y,r:80,t:.35,m:.35,col:c.col});

else if(i==1){P.inv=Math.max(P.inv,3);P.guard=3;for(const e of E){const dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy)||1;if(d<120)hurtE(e,c.atk,0,dx/d,dy/d,700)}FX.push({k:'ring',x:P.x,y:P.y,r:120,t:.4,m:.4,col:'#ffd36a'})}
else if(i==2)PB.push(mkB({x:bx,y:by,a,sp:1100,r:14,dmg:c.atk*4,fc:1,pierce:99,life:.9,k:'big',kb:300}));
else if(i==3){const nx=P.x+ca*140,ny=P.y+sa*140;for(const e of E)if(!e.dead&&Math.hypot(e.x-nx,e.y-ny)<120+e.r){hurtE(e,c.atk,0,0,0,0);e.stun=e.boss?1:3}FX.push({k:'net',x:nx,y:ny,r:120,t:.9,m:.9,col:'#9fe0ff'})}
else{TR.push({x:P.x,y:P.y,t:15,arm:.5});if(TR.length>3)TR.shift()}}
function bossAI(e,dt){const ph2=e.hp<e.max*.5,sp=ph2?1.4:1,dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1,a=Math.atan2(dy,dx);
e.face=dx>=0?1:-1;if(d<e.r+P.r&&e.act!='jump')hurt(ED());
if(e.stun>0){e.stun-=dt;return}
if(!e.act){e.cd-=dt;if(d>150)mv(e,dx/d*70*dt,dy/d*70*dt);
if(e.cd<=0){const ps=['slash','jump','burst','circle','summon','charge'].filter(x=>x!=e.last);e.act=e.last=ps[Math.random()*ps.length|0];e.at=0;e.s=0}return}
e.at+=dt*sp;const t=e.at,A=e.act,done=()=>{e.act=null;e.cd=ph2?.7:1.3;e.z=0};
if(A=='slash'){if(!e.s){e.s=1;e.a=a;HZ.push({k:'cone',x:e.x,y:e.y,r:140,a:e.a,arc:2,t:.8/sp,m:.8/sp,dmg:2})}if(t>1.3)done()}
else if(A=='jump'){if(!e.s){e.s=1;e.sx=e.x;e.sy=e.y;e.tx=clamp(P.x,70,WW-70);e.ty=clamp(P.y,70,WH-70);HZ.push({k:'c',x:e.tx,y:e.ty,r:95,t:1.1/sp,m:1.1/sp,dmg:2})}
if(t>.5&&t<1.1){const p=(t-.5)/.6;e.x=e.sx+(e.tx-e.sx)*p;e.y=e.sy+(e.ty-e.sy)*p;e.z=Math.sin(p*Math.PI)*90}
else if(t>=1.1&&e.s==1){e.s=2;e.x=e.tx;e.y=e.ty;e.z=0;shake=10;let n=0;while(hit(e)&&n++<40){e.x+=(WW/2-e.x)*.05;e.y+=(WH/2-e.y)*.05}if(ph2)ring(e,12,0,170)}
